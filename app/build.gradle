plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.tilin.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.tilin.app"
        minSdk 26
        targetSdk 34
        versionCode 124
        versionName "2.8"
    }
    signingConfigs {
        rovika {
            storeFile file('../rovika.keystore')
            storePassword 'rovika123'
            keyAlias 'rovika'
            keyPassword 'rovika123'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.rovika
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
