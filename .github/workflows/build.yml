                          Color.parseColor(if (hoy) "#2F6BFF" else "#1B2F66"),
                          Shader.TileMode.CLAMP
                      )
                      canvas.drawRoundRect(RectF(x, base - alto, x + bw, base), 6f * d, 6f * d, p)
                      p.shader = null
                      p.color = Color.parseColor(if (hoy) "#22D3EE" else "#8A97B0")
                      p.textSize = 11f * d
