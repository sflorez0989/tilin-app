                  col.addView(texto(nom, 15f, Color.WHITE, true))
                  col.addView(texto(pk, 11f, gris))
                  f.addView(col)
                  if (Apps.esAuto(pk, nom)) {
                      f.addView(texto("✔ Automática", 12f, verde, true))
                  } else {
                      val on = activadas.contains(pk)
                      val b = Button(this)
