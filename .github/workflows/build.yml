name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Crear archivos de la app
        run: |
          mkdir -p app/src/main/java/com/tilin/app
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Tilin"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tilin.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tilin.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#0B7A4B</color>
          </resources>
          EOF
          cat > app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group
                  android:scaleX="2.5"
                  android:scaleY="2.5"
                  android:translateX="24"
                  android:translateY="24">
                  <path
                      android:fillColor="#FFFFFF"
                      android:pathData="M12,22c1.1,0 2,-0.9 2,-2h-4c0,1.1 0.89,2 2,2zM18,16v-5c0,-3.07 -1.64,-5.64 -4.5,-6.32V4c0,-0.83 -0.67,-1.5 -1.5,-1.5s-1.5,0.67 -1.5,1.5v0.68C7.63,5.36 6,7.92 6,11v5l-2,2v1h16v-1l-2,-2z" />
              </group>
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M79,38a9,9 0 1,0 -18,0a9,9 0 1,0 18,0z" />
          </vector>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Tilín"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PagoListenerService"
                      android:exported="true"
                      android:label="Tilín"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/tilin/app/Aviso.kt <<'EOF'
          package com.tilin.app

          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          object Aviso {
              private val h = Handler(Looper.getMainLooper())
              private var vista: View? = null
              private var quitar: Runnable? = null

              fun fmt(n: Long): String =
                  n.toString().reversed().chunked(3).joinToString(".").reversed()

              private fun ocultar(wm: WindowManager) {
                  quitar?.let { h.removeCallbacks(it) }
                  vista?.let {
                      try { wm.removeView(it) } catch (e: Exception) { }
                  }
                  vista = null
                  quitar = null
              }

              fun mostrar(ctx: Context, titulo: String, monto: String, banco: String) {
                  h.post {
                      try {
                          val c = ctx.applicationContext
                          if (!Settings.canDrawOverlays(c)) {
                              Toast.makeText(c, titulo + "\n" + monto + " · " + banco, Toast.LENGTH_LONG).show()
                          } else {
                              val wm = c.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                              ocultar(wm)
                              val d = c.resources.displayMetrics.density

                              val fondo = GradientDrawable()
                              fondo.setColor(Color.parseColor("#0B7A4B"))
                              fondo.cornerRadius = 24f * d

                              val caja = LinearLayout(c)
                              caja.orientation = LinearLayout.VERTICAL
                              caja.gravity = Gravity.CENTER_HORIZONTAL
                              caja.background = fondo
                              caja.setPadding((28 * d).toInt(), (18 * d).toInt(), (28 * d).toInt(), (18 * d).toInt())

                              val t1 = TextView(c)
                              t1.text = titulo
                              t1.textSize = 20f
                              t1.setTextColor(Color.WHITE)
                              t1.setTypeface(null, Typeface.BOLD)
                              t1.gravity = Gravity.CENTER
                              caja.addView(t1)

                              val t2 = TextView(c)
                              t2.text = monto
                              t2.textSize = 34f
                              t2.setTextColor(Color.parseColor("#FFC107"))
                              t2.setTypeface(null, Typeface.BOLD)
                              t2.gravity = Gravity.CENTER
                              caja.addView(t2)

                              val t3 = TextView(c)
                              t3.text = banco
                              t3.textSize = 15f
                              t3.setTextColor(Color.parseColor("#D6F5E6"))
                              t3.gravity = Gravity.CENTER
                              caja.addView(t3)

                              val lp = WindowManager.LayoutParams(
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                                  PixelFormat.TRANSLUCENT
                              )
                              lp.gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                              lp.y = (70 * d).toInt()

                              wm.addView(caja, lp)
                              vista = caja
                              val r = Runnable { ocultar(wm) }
                              quitar = r
                              h.postDelayed(r, 5000)
                          }
                      } catch (e: Exception) {
                      }
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/tilin/app/PagoListenerService.kt <<'EOF'
          package com.tilin.app

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          class PagoListenerService : NotificationListenerService(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null

              private val palabras = listOf(
                  "te enviaron", "te envió", "te envio", "recibiste",
                  "te llegó", "te llego", "te pagaron", "te transfirieron",
                  "has recibido", "te mandaron", "te mandó", "te mando",
                  "te depositaron", "te transfirió", "te transfirio",
                  "te consignaron", "llegó dinero", "llego dinero",
                  "dinero recibido", "ha llegado", "te enviaron plata"
              )

              private val montoRegex =
                  Regex("""\$\s?(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?|\d+)""")

              private val bancos = listOf(
                  "Nequi" to Regex("nequi", RegexOption.IGNORE_CASE),
                  "Bancolombia" to Regex("bancolombia", RegexOption.IGNORE_CASE),
                  "Daviplata" to Regex("daviplata", RegexOption.IGNORE_CASE),
                  "Davivienda" to Regex("davivienda", RegexOption.IGNORE_CASE),
                  "Nu" to Regex("\\bnu\\b|nubank", RegexOption.IGNORE_CASE),
                  "BBVA" to Regex("bbva", RegexOption.IGNORE_CASE),
                  "Banco de Bogotá" to Regex("banco de bogot", RegexOption.IGNORE_CASE),
                  "Itaú" to Regex("ita[uú]", RegexOption.IGNORE_CASE),
                  "Banco Popular" to Regex("banco popular", RegexOption.IGNORE_CASE),
                  "AV Villas" to Regex("av villas", RegexOption.IGNORE_CASE),
                  "Banco de Occidente" to Regex("occidente", RegexOption.IGNORE_CASE),
                  "Scotiabank" to Regex("scotiabank|colpatria", RegexOption.IGNORE_CASE),
                  "Lulo" to Regex("\\blulo\\b", RegexOption.IGNORE_CASE),
                  "Movii" to Regex("\\bmovii\\b", RegexOption.IGNORE_CASE)
              )

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("es", "CO")
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) return

                  val extras = sbn.notification.extras
                  val titulo = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val cuerpo = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()
                      ?: extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val completo = titulo + " " + cuerpo

                  if (!esAppDePagos(sbn.packageName)) return

                  guardarLog(sbn.packageName + ": " + completo)

                  if (!completo.contains("$")) return

                  val minuscula = completo.lowercase()
                  if (palabras.none { minuscula.contains(it) }) return

                  val match = montoRegex.find(completo) ?: return
                  var n = match.groupValues[1]
                  val c = n.lastIndexOf(',')
                  if (c >= 0 && n.length - c - 1 <= 2) n = n.substring(0, c)
                  n = n.replace(".", "").replace(",", "")
                  val monto = n.toLongOrNull() ?: return

                  val app = try {
                      packageManager.getApplicationLabel(
                          packageManager.getApplicationInfo(sbn.packageName, 0)
                      ).toString()
                  } catch (e: Exception) {
                      sbn.packageName
                  }

                  val nombre = sacarNombre(cuerpo, titulo)
                  val banco = sacarBanco(completo, app)
                  guardarPago(monto, app, nombre, banco)

                  val quien = if (nombre.isNotEmpty()) " de " + nombre else ""
                  tts?.speak("Te llegaron " + monto + " pesos" + quien + " por " + banco, TextToSpeech.QUEUE_ADD, null, "pago")
                  Aviso.mostrar(
                      this,
                      if (nombre.isNotEmpty()) nombre else "Pago recibido",
                      "$ " + Aviso.fmt(monto),
                      banco
                  )
              }

              private fun sacarBanco(texto: String, app: String): String {
                  for (b in bancos) {
                      if (b.second.containsMatchIn(texto)) return b.first
                  }
                  return app
              }

              private fun limpiarNombre(n: String): String {
                  val corte = Regex("\\s+(?:en|por|a|el|la|con|y|desde|para|hoy|ahora|te)\\b", RegexOption.IGNORE_CASE)
                  var s = n.split(corte)[0].trim()
                  s = s.replace(Regex("^(?:hola|hey|ya|que|un|una|el|la)\\s+", RegexOption.IGNORE_CASE), "")
                  if (s.lowercase() in listOf("nequi", "bancolombia", "alguien", "te", "tu")) return ""
                  val partes = s.lowercase().split(" ").filter { it.isNotBlank() }
                  val resultado = partes.joinToString(" ") { w -> w.substring(0, 1).uppercase() + w.substring(1) }
                  return resultado.take(40)
              }

              private fun sacarNombre(cuerpo: String, titulo: String): String {
                  val letras = "[\\p{L}]+(?:\\s+[\\p{L}]+){0,3}"
                  val antes = Regex("(" + letras + ")\\s+te\\s+(?:envi|mand|transfiri|deposit|pag|consign)", RegexOption.IGNORE_CASE)
                  val despues = Regex("[$]\\s?[\\d.,]+\\s+(?:de|desde)\\s+(" + letras + ")", RegexOption.IGNORE_CASE)

                  var n = limpiarNombre(antes.find(cuerpo)?.groupValues?.get(1) ?: "")
                  if (n.isEmpty()) n = limpiarNombre(despues.find(cuerpo)?.groupValues?.get(1) ?: "")
                  if (n.isEmpty()) n = limpiarNombre(antes.find(titulo)?.groupValues?.get(1) ?: "")
                  if (n.isEmpty()) n = limpiarNombre(despues.find(titulo)?.groupValues?.get(1) ?: "")
                  return n
              }

              private fun esAppDePagos(pkg: String): Boolean {
                  val p = pkg.lowercase()
                  return listOf(
                      "nequi", "bancolombia", "daviplata", "davivienda",
                      "com.nu.", "nubank", "bancodebogota", "bbva", "itau",
                      "lulo", "movii", "pibank", "rappipay", "tpaga", "breb"
                  ).any { p.contains(it) }
              }

              private fun guardarPago(monto: Long, app: String, nombre: String, banco: String) {
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val actuales = prefs.getString("pagos", "") ?: ""
                  val lista = actuales.split("\n").filter { it.isNotBlank() }.toMutableList()
                  val limpio = { s: String -> s.replace("|", " ").replace("\n", " ") }
                  lista.add(0, System.currentTimeMillis().toString() + "|" + monto + "|" + limpio(app) + "|" + limpio(nombre) + "|" + limpio(banco))
                  prefs.edit().putString("pagos", lista.take(3000).joinToString("\n")).apply()
              }

              private fun guardarLog(linea: String) {
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val actuales = prefs.getString("log", "") ?: ""
                  val lista = actuales.split("\n---\n").filter { it.isNotBlank() }.toMutableList()
                  lista.add(0, linea)
                  val recortada = lista.take(15).joinToString("\n---\n")
                  prefs.edit().putString("log", recortada).apply()
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/tilin/app/MainActivity.kt <<'EOF'
          package com.tilin.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class Pago(val ts: Long, val monto: Long, val app: String, val nombre: String, val banco: String)

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private lateinit var contenido: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var tabInicio: TextView
              private lateinit var tabMov: TextView
              private var pestana = 0
              private var diaPintado = ""
              private val h = Handler(Looper.getMainLooper())
              private val tic = object : Runnable {
                  override fun run() {
                      if (hoyStr() != diaPintado) dibujar()
                      h.postDelayed(this, 30000)
                  }
              }

              private val gris = Color.parseColor("#9AA5A0")
              private val verde = Color.parseColor("#19C37D")
              private val ambar = Color.parseColor("#FFC107")
              private val fondo = Color.parseColor("#0F1411")

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun hoyStr(): String = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              private fun caja(color: Int, radio: Int, borde: Int = 0): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(radio).toFloat()
                  if (borde != 0) g.setStroke(dp(1), borde)
                  return g
              }

              private fun texto(t: String, size: Float, color: Int, bold: Boolean = false): TextView {
                  val v = TextView(this)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(color)
                  if (bold) v.setTypeface(null, Typeface.BOLD)
                  return v
              }

              private fun tarjeta(color: Int): LinearLayout {
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.background = caja(color, 20)
                  l.setPadding(dp(18), dp(16), dp(18), dp(16))
                  val p = LinearLayout.LayoutParams(-1, -2)
                  p.setMargins(0, 0, 0, dp(12))
                  l.layoutParams = p
                  return l
              }

              private fun boton(t: String, lleno: Boolean, accion: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.isAllCaps = false
                  b.textSize = 16f
                  b.setTextColor(if (lleno) Color.WHITE else Color.parseColor("#19C37D"))
                  b.background = if (lleno) caja(Color.parseColor("#0B7A4B"), 14)
                  else caja(Color.TRANSPARENT, 14, Color.parseColor("#19C37D"))
                  b.setOnClickListener { accion() }
                  val p = LinearLayout.LayoutParams(-1, dp(52))
                  p.setMargins(0, 0, 0, dp(10))
                  b.layoutParams = p
                  return b
              }

              private fun leerPagos(): List<Pago> {
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val lineas = (prefs.getString("pagos", "") ?: "").split("\n").filter { it.isNotBlank() }
                  val resultado = mutableListOf<Pago>()
                  for (linea in lineas) {
                      val c = linea.split("|")
                      if (c.size < 3) continue
                      val nombre = if (c.size > 3) c[3] else ""
                      val banco = if (c.size > 4) c[4] else c[2]
                      resultado.add(Pago(c[0].toLongOrNull() ?: 0L, c[1].toLongOrNull() ?: 0L, c[2], nombre, banco))
                  }
                  return resultado
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)
                  window.statusBarColor = fondo
                  window.navigationBarColor = Color.parseColor("#161C18")

                  val raiz = LinearLayout(this)
                  raiz.orientation = LinearLayout.VERTICAL
                  raiz.setBackgroundColor(fondo)

                  scroll = ScrollView(this)
                  scroll.layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  contenido = LinearLayout(this)
                  contenido.orientation = LinearLayout.VERTICAL
                  contenido.setPadding(dp(20), dp(24), dp(20), dp(32))
                  scroll.addView(contenido)

                  val barra = LinearLayout(this)
                  barra.orientation = LinearLayout.HORIZONTAL
                  barra.setBackgroundColor(Color.parseColor("#161C18"))
                  barra.layoutParams = LinearLayout.LayoutParams(-1, -2)

                  tabInicio = texto("Inicio", 16f, verde, true)
                  tabMov = texto("Movimientos", 16f, gris, true)
                  for (t in listOf(tabInicio, tabMov)) {
                      t.gravity = Gravity.CENTER
                      t.layoutParams = LinearLayout.LayoutParams(0, dp(56), 1f)
                      barra.addView(t)
                  }
                  tabInicio.setOnClickListener { pestana = 0; scroll.scrollTo(0, 0); dibujar() }
                  tabMov.setOnClickListener { pestana = 1; scroll.scrollTo(0, 0); dibujar() }

                  raiz.addView(scroll)
                  raiz.addView(barra)
                  setContentView(raiz)
              }

              override fun onResume() {
                  super.onResume()
                  dibujar()
                  h.removeCallbacks(tic)
                  h.postDelayed(tic, 30000)
              }

              override fun onPause() {
                  h.removeCallbacks(tic)
                  super.onPause()
              }

              private fun dibujar() {
                  diaPintado = hoyStr()
                  tabInicio.setTextColor(if (pestana == 0) verde else Color.parseColor("#6B7570"))
                  tabMov.setTextColor(if (pestana == 1) verde else Color.parseColor("#6B7570"))
                  contenido.removeAllViews()
                  if (pestana == 0) dibujarInicio() else dibujarMov()
              }

              private fun filaPago(p: Pago, hora: SimpleDateFormat): LinearLayout {
                  val f = tarjeta(Color.parseColor("#1B221E"))
                  val quien = if (p.nombre.isNotEmpty()) p.nombre else "Pago recibido"
                  f.addView(texto(quien, 16f, Color.WHITE, true))
                  f.addView(texto("+ $ " + Aviso.fmt(p.monto), 22f, verde, true))
                  f.addView(texto(p.banco + " · " + hora.format(Date(p.ts)), 13f, gris))
                  return f
              }

              private fun dibujarInicio() {
                  val activos = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  val activo = activos.contains(packageName)
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)

                  contenido.addView(texto("Tilín 🔔", 32f, Color.WHITE, true))
                  val sub = texto("Tus pagos, en voz alta", 15f, gris)
                  sub.setPadding(0, dp(2), 0, dp(20))
                  contenido.addView(sub)

                  val estado = tarjeta(if (activo) Color.parseColor("#12392A") else Color.parseColor("#3A2A12"))
                  estado.addView(texto(
                      if (activo) "● Activo y escuchando" else "● Falta el permiso",
                      17f, if (activo) verde else ambar, true))
                  estado.addView(texto(
                      if (activo) "Tilín te avisará cuando llegue un pago."
                      else "Toca el botón de abajo y activa Tilín en la lista.",
                      14f, gris))
                  contenido.addView(estado)

                  val hoy = hoyStr()
                  val dia = SimpleDateFormat("yyyyMMdd", Locale.US)
                  val hora = SimpleDateFormat("h:mm a", Locale("es", "CO"))
                  val pagos = leerPagos().filter { dia.format(Date(it.ts)) == hoy }
                  val total = pagos.fold(0L) { a, p -> a + p.monto }

                  val tTotal = tarjeta(Color.parseColor("#1B221E"))
                  tTotal.addView(texto("Hoy llevas", 14f, gris))
                  tTotal.addView(texto("$ " + Aviso.fmt(total), 40f, Color.WHITE, true))
                  tTotal.addView(texto(pagos.size.toString() + " pagos", 14f, verde, true))
                  contenido.addView(tTotal)

                  if (!activo) {
                      contenido.addView(boton("Dar permiso de notificaciones", true) {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      })
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      contenido.addView(boton("Activar avisos en pantalla", true) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                      })
                  }
                  contenido.addView(boton("Probar voz y aviso", activo) {
                      tts?.speak("Te llegaron 15000 pesos de Juan Pérez por Nequi", TextToSpeech.QUEUE_FLUSH, null, "test")
                      Aviso.mostrar(this, "Juan Pérez", "$ 15.000", "Nequi")
                  })
                  if (activo) {
                      contenido.addView(boton("Permisos de notificaciones", false) {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      })
                  }

                  val h1 = texto("Pagos de hoy", 18f, Color.WHITE, true)
                  h1.setPadding(0, dp(14), 0, dp(10))
                  contenido.addView(h1)

                  if (pagos.isEmpty()) {
                      contenido.addView(texto("Aún no hay pagos hoy.", 14f, gris))
                  } else {
                      for (p in pagos) contenido.addView(filaPago(p, hora))
                  }

                  val h2 = texto("Últimas notificaciones de apps de pagos", 13f, gris, true)
                  h2.setPadding(0, dp(20), 0, dp(6))
                  contenido.addView(h2)
                  val log = prefs.getString("log", "") ?: ""
                  val lv = texto(if (log.isBlank()) "Todavía no hay notificaciones." else log, 11f, Color.parseColor("#6B7570"))
                  lv.setTextIsSelectable(true)
                  contenido.addView(lv)
              }

              private fun dibujarMov() {
                  contenido.addView(texto("Movimientos", 28f, Color.WHITE, true))
                  val sub = texto("Pagos por día", 15f, gris)
                  sub.setPadding(0, dp(2), 0, dp(20))
                  contenido.addView(sub)

                  val dia = SimpleDateFormat("yyyyMMdd", Locale.US)
                  val hora = SimpleDateFormat("h:mm a", Locale("es", "CO"))
                  val larga = SimpleDateFormat("EEEE d 'de' MMMM", Locale("es", "CO"))
                  val hoy = hoyStr()
                  val ayer = dia.format(Date(System.currentTimeMillis() - 86400000L))

                  val pagos = leerPagos()
                  if (pagos.isEmpty()) {
                      contenido.addView(texto("Aún no hay movimientos.", 14f, gris))
                      return
                  }

                  val grupos = pagos.groupBy { dia.format(Date(it.ts)) }
                  for (entrada in grupos.entries) {
                      val clave = entrada.key
                      val lista = entrada.value
                      val etiqueta = if (clave == hoy) "Hoy"
                      else if (clave == ayer) "Ayer"
                      else {
                          val txt = larga.format(Date(lista[0].ts))
                          txt.substring(0, 1).uppercase() + txt.substring(1)
                      }
                      val total = lista.fold(0L) { a, p -> a + p.monto }

                      val cab = tarjeta(Color.parseColor("#12392A"))
                      cab.addView(texto(etiqueta, 16f, Color.WHITE, true))
                      cab.addView(texto("$ " + Aviso.fmt(total), 26f, verde, true))
                      cab.addView(texto(lista.size.toString() + " pagos", 13f, gris))
                      contenido.addView(cab)

                      for (p in lista) contenido.addView(filaPago(p, hora))
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("es", "CO")
                  }
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tilin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
