          cat > app/src/main/java/com/tilin/app/Aviso.kt <<'EOF'
          package com.tilin.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.view.animation.OvershootInterpolator
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Aviso {
              private const val CANAL = "pagos_recibidos"
              private val h = Handler(Looper.getMainLooper())
              private var vista: LinearLayout? = null
              private var wmActual: WindowManager? = null
              private var tvTitulo: TextView? = null
              private var tvMonto: TextView? = null
              private var tvBanco: TextView? = null
              private var quitar: Runnable? = null
              private var desvanecer: Runnable? = null
              private var claveActual = ""

              fun fmt(n: Long): String =
                  n.toString().reversed().chunked(3).joinToString(".").reversed()

              fun diag(ctx: Context, texto: String) {
                  try {
                      val hora = SimpleDateFormat("h:mm:ss a", Locale("es", "CO")).format(Date())
                      ctx.applicationContext.getSharedPreferences("tilin", Context.MODE_PRIVATE)
                          .edit().putString("diag", hora + " · " + texto).apply()
                  } catch (e: Exception) { }
              }

              fun mostrar(ctx: Context, titulo: String, monto: String, banco: String) {
                  try {
                      val c = ctx.applicationContext
                      val p = c.getSharedPreferences("tilin", Context.MODE_PRIVATE)
                      val estilo = p.getString("estilo", "sistema") ?: "sistema"
                      val dur = p.getInt("dur", 6).coerceIn(2, 20)
                      if (estilo == "letrero" && Settings.canDrawOverlays(c)) {
                          mostrarLetrero(
                              c, titulo, monto, banco, dur,
                              p.getInt("tam", 1), p.getInt("posV", 0), p.getInt("posH", 1)
                          )
                      } else {
                          if (estilo == "letrero") diag(c, "falta permiso de aparecer encima, uso emergente del sistema")
                          mostrarSistema(c, titulo, monto, banco, dur)
                      }
                  } catch (e: Exception) {
                      diag(ctx, "ERROR: " + e.javaClass.simpleName + " " + (e.message ?: ""))
                  }
              }

              private fun mostrarSistema(c: Context, titulo: String, monto: String, banco: String, dur: Int) {
                  try {
                      val nm = c.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (nm.getNotificationChannel(CANAL) == null) {
                          val ch = NotificationChannel(CANAL, "Pagos recibidos", NotificationManager.IMPORTANCE_HIGH)
                          ch.description = "Aviso emergente cuando llega un pago"
                          ch.enableVibration(false)
                          ch.setSound(null, null)
                          nm.createNotificationChannel(ch)
                      }
                      if (!nm.areNotificationsEnabled()) {
                          diag(c, "las notificaciones de Rovika están apagadas")
                          return
                      }
                      val abrir = PendingIntent.getActivity(
                          c, 0, Intent(c, MainActivity::class.java),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      val n = Notification.Builder(c, CANAL)
                          .setSmallIcon(R.drawable.ic_notif)
                          .setContentTitle("+ " + monto)
                          .setContentText(titulo + " · " + banco)
                          .setColor(Color.parseColor("#22D3EE"))
                          .setAutoCancel(true)
                          .setTimeoutAfter(dur * 1000L)
                          .setContentIntent(abrir)
                          .build()
                      nm.notify(1001, n)
                      diag(c, "aviso emergente del sistema enviado")
                  } catch (e: Exception) {
                      diag(c, "ERROR sistema: " + e.javaClass.simpleName + " " + (e.message ?: ""))
                  }
              }

              private fun cancelarTemporizadores() {
                  quitar?.let { h.removeCallbacks(it) }
                  desvanecer?.let { h.removeCallbacks(it) }
                  quitar = null
                  desvanecer = null
              }

              private fun retirar() {
                  cancelarTemporizadores()
                  val v = vista
                  val wm = wmActual
                  vista = null
                  wmActual = null
                  tvTitulo = null
                  tvMonto = null
                  tvBanco = null
                  claveActual = ""
                  if (v != null && wm != null) {
                      try {
                          wm.removeViewImmediate(v)
                      } catch (e: Exception) { }
                  }
              }

              private fun programar(c: Context, dur: Int) {
                  cancelarTemporizadores()
                  val total = dur * 1000L
                  val f = Runnable {
                      try {
                          vista?.animate()?.alpha(0f)?.setDuration(280)?.start()
                      } catch (e: Exception) { }
                  }
                  val r = Runnable {
                      retirar()
                      diag(c, "letrero retirado después de " + dur + " segundos")
                  }
                  desvanecer = f
                  quitar = r
                  h.postDelayed(f, total - 300L)
                  h.postDelayed(r, total)
              }

              private fun mostrarLetrero(
                  c: Context, titulo: String, monto: String, banco: String,
                  dur: Int, tam: Int, posV: Int, posH: Int
              ) {
                  h.post {
                      try {
                          val clave = tam.toString() + "-" + posV + "-" + posH
                          val actual = vista
                          if (actual != null && clave == claveActual) {
                              actual.animate().cancel()
                              actual.alpha = 1f
                              actual.scaleX = 1f
                              actual.scaleY = 1f
                              tvTitulo?.text = titulo
                              tvMonto?.text = monto
                              tvBanco?.text = banco
                              programar(c, dur)
                              diag(c, "letrero actualizado, se queda " + dur + " segundos")
                          } else {
                              if (actual != null) retirar()
                              val wm = c.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                              val d = c.resources.displayMetrics.density
                              val e = if (tam == 0) 0.8f else if (tam == 2) 1.4f else 1f

                              val fondo = GradientDrawable()
                              fondo.setColor(Color.BLACK)
                              fondo.cornerRadius = 40f * d
                              fondo.setStroke((1 * d).toInt().coerceAtLeast(1), Color.parseColor("#5522D3EE"))

                              val caja = LinearLayout(c)
                              caja.orientation = LinearLayout.HORIZONTAL
                              caja.gravity = Gravity.CENTER_VERTICAL
                              caja.background = fondo
                              caja.setPadding(
                                  (18 * d * e).toInt(), (10 * d * e).toInt(),
                                  (22 * d * e).toInt(), (10 * d * e).toInt()
                              )

                              val ico = TextView(c)
                              ico.text = "🔔"
                              ico.textSize = 22f * e
                              caja.addView(ico)

                              val centro = LinearLayout(c)
                              centro.orientation = LinearLayout.VERTICAL
                              centro.setPadding((12 * d * e).toInt(), 0, (18 * d * e).toInt(), 0)

                              val t1 = TextView(c)
                              t1.text = titulo
                              t1.textSize = 15f * e
                              t1.setTextColor(Color.WHITE)
                              t1.setTypeface(null, Typeface.BOLD)
                              t1.maxLines = 1
                              centro.addView(t1)

                              val t3 = TextView(c)
                              t3.text = banco
                              t3.textSize = 12f * e
                              t3.setTextColor(Color.parseColor("#8A97B0"))
                              t3.maxLines = 1
                              centro.addView(t3)
                              caja.addView(centro)

                              val t2 = TextView(c)
                              t2.text = monto
                              t2.textSize = 22f * e
                              t2.setTextColor(Color.parseColor("#2EE59D"))
                              t2.setTypeface(null, Typeface.BOLD)
                              t2.maxLines = 1
                              caja.addView(t2)

                              val lp = WindowManager.LayoutParams(
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  WindowManager.LayoutParams.WRAP_CONTENT,
                                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                                  PixelFormat.TRANSLUCENT
                              )
                              val v = if (posV == 0) Gravity.TOP else if (posV == 2) Gravity.BOTTOM else Gravity.CENTER_VERTICAL
                              val hz = if (posH == 0) Gravity.START else if (posH == 2) Gravity.END else Gravity.CENTER_HORIZONTAL
                              lp.gravity = v or hz
                              lp.y = if (posV == 1) 0 else (56 * d).toInt()
                              lp.x = if (posH == 1) 0 else (16 * d).toInt()

                              caja.alpha = 0f
                              caja.scaleX = 0.6f
                              caja.scaleY = 0.6f
                              wm.addView(caja, lp)
                              vista = caja
                              wmActual = wm
                              tvTitulo = t1
                              tvMonto = t2
                              tvBanco = t3
                              claveActual = clave
                              diag(c, "letrero dibujado, se queda " + dur + " segundos")
                              caja.animate()
                                  .alpha(1f)
                                  .scaleX(1f)
                                  .scaleY(1f)
                                  .setDuration(350)
                                  .setInterpolator(OvershootInterpolator(1.1f))
                                  .start()
                              programar(c, dur)
                          }
                      } catch (ex: Exception) {
                          diag(c, "ERROR letrero: " + ex.javaClass.simpleName + " " + (ex.message ?: ""))
                      }
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/tilin/app/PagoListenerService.kt <<'EOF'
          package com.tilin.app

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          class PagoListenerService : NotificationListenerService(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private var ultimaClave = ""
              private var ultimaHora = 0L

              private val palabras = listOf(
                  "te enviaron", "te envió", "te envio", "recibiste",
                  "te llegó", "te llego", "te pagaron", "te transfirieron",
                  "has recibido", "te mandaron", "te mandó", "te mando",
                  "te depositaron", "te transfirió", "te transfirio",
                  "te consignaron", "llegó dinero", "llego dinero",
                  "dinero recibido", "ha llegado", "te enviaron plata",
                  "recarga", "recepción", "recepcion", "bre-b", "bre b",
                  "abono", "ingreso", "depósito", "deposito"
              )

              private val negativas = listOf(
                  "enviaste", "pagaste", "compraste", "compra ", "retiro",
                  "retiraste", "gmf", "impuesto", "cobro", "débito", "debito",
                  "transferiste", "pago de", "pago a "
              )

              private val montoRegex =
                  Regex("""\$\s?(\d{1,3}(?:[.,]\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)""")

              private val montoSinSigno =
                  Regex(
                      """(?:te\s+envi[oó]|te\s+mand[oó]|te\s+transfiri[oó]|te\s+pag[oó]|te\s+deposit[oó]|te\s+consign[oó])\s+(\d{1,3}(?:[.,]\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?)""",
                      RegexOption.IGNORE_CASE
                  )

              private val bancos = listOf(
                  "Nequi" to Regex("nequi", RegexOption.IGNORE_CASE),
                  "Bancolombia" to Regex("bancolombia", RegexOption.IGNORE_CASE),
                  "Daviplata" to Regex("daviplata", RegexOption.IGNORE_CASE),
                  "Davivienda" to Regex("davivienda", RegexOption.IGNORE_CASE),
                  "Nu" to Regex("\\bnu\\b|nubank", RegexOption.IGNORE_CASE),
                  "BBVA" to Regex("bbva", RegexOption.IGNORE_CASE),
                  "Banco de Bogotá" to Regex("banco de bogot", RegexOption.IGNORE_CASE),
                  "Itaú" to Regex("ita[uú]", RegexOption.IGNORE_CASE),
                  "Banco Popular" to Regex("banco popular", RegexOption.IGNORE_CASE),
                  "AV Villas" to Regex("av villas", RegexOption.IGNORE_CASE),
                  "Banco de Occidente" to Regex("occidente", RegexOption.IGNORE_CASE),
                  "Scotiabank" to Regex("scotiabank|colpatria", RegexOption.IGNORE_CASE),
                  "Lulo" to Regex("\\blulo\\b", RegexOption.IGNORE_CASE),
                  "Movii" to Regex("\\bmovii\\b", RegexOption.IGNORE_CASE)
              )

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("es", "CO")
                  }
              }

              private fun parseMonto(s: String): Long? {
                  var n = s
                  val c = n.lastIndexOf(',')
                  if (c >= 0 && n.length - c - 1 <= 2) n = n.substring(0, c)
                  n = n.replace(".", "").replace(",", "")
                  return n.toLongOrNull()
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) return

                  val extras = sbn.notification.extras
                  val titulo = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val cuerpo = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()
                      ?: extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val completo = titulo + " " + cuerpo

                  if (!esAppDePagos(sbn.packageName)) return

                  guardarLog(sbn.packageName + ": " + completo)

                  val minuscula = completo.lowercase()
                  if (negativas.any { minuscula.contains(it) }) return
                  if (palabras.none { minuscula.contains(it) }) return

                  val m1 = montoRegex.find(completo)
                  val m2 = if (m1 == null) montoSinSigno.find(completo) else null
                  val crudo = (m1 ?: m2)?.groupValues?.get(1) ?: return
                  val monto = parseMonto(crudo) ?: return

                  val app = try {
                      packageManager.getApplicationLabel(
                          packageManager.getApplicationInfo(sbn.packageName, 0)
                      ).toString()
                  } catch (e: Exception) {
                      sbn.packageName
                  }

                  val origen = sacarOrigen(completo, app, sbn.packageName)

                  val clave = monto.toString() + "|" + origen
                  val ahora = System.currentTimeMillis()
                  if (clave == ultimaClave && ahora - ultimaHora < 45000L) {
                      Aviso.diag(this, "pago repetido ignorado")
                      return
                  }
                  ultimaClave = clave
                  ultimaHora = ahora

                  guardarPago(monto, app, "", origen)

                  tts?.speak("Te llegaron " + monto + " pesos por " + origen, TextToSpeech.QUEUE_ADD, null, "pago")
                  try {
                      Aviso.mostrar(
                          this,
                          origen,
                          "$ " + Aviso.fmt(monto),
                          app
                      )
                  } catch (e: Exception) {
                      Aviso.diag(this, "ERROR servicio: " + e.javaClass.simpleName + " " + (e.message ?: ""))
                  }
              }

              private fun sacarOrigen(texto: String, app: String, pkg: String): String {
                  val t = texto.lowercase()
                  if (t.contains("bre-b") || t.contains("bre b")) return "Bre-B"
                  var otro = ""
                  for (b in bancos) {
                      if (b.first != "Nequi" && b.second.containsMatchIn(texto)) {
                          otro = b.first
                          break
                      }
                  }
                  if (t.contains("recarga")) {
                      return if (otro.isNotEmpty()) "Recarga " + otro else "Recarga"
                  }
                  if (otro.isNotEmpty()) return otro
                  for (b in bancos) {
                      if (b.second.containsMatchIn(texto)) return b.first
                  }
                  val p = pkg.lowercase()
                  for (b in bancos) {
                      if (p.contains(b.first.lowercase().replace(" ", ""))) return b.first
                  }
                  return app
              }

              private fun esAppDePagos(pkg: String): Boolean {
                  val p = pkg.lowercase()
                  return listOf(
                      "nequi", "bancolombia", "daviplata", "davivienda",
                      "com.nu.", "nubank", "bancodebogota", "bbva", "itau",
                      "lulo", "movii", "pibank", "rappipay", "tpaga", "breb"
                  ).any { p.contains(it) }
              }

              private fun guardarPago(monto: Long, app: String, nombre: String, banco: String) {
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val actuales = prefs.getString("pagos", "") ?: ""
                  val lista = actuales.split("\n").filter { it.isNotBlank() }.toMutableList()
                  val limpio = { s: String -> s.replace("|", " ").replace("\n", " ") }
                  lista.add(0, System.currentTimeMillis().toString() + "|" + monto + "|" + limpio(app) + "|" + limpio(nombre) + "|" + limpio(banco))
                  prefs.edit().putString("pagos", lista.take(3000).joinToString("\n")).apply()
              }

              private fun guardarLog(linea: String) {
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val actuales = prefs.getString("log", "") ?: ""
                  val lista = actuales.split("\n---\n").filter { it.isNotBlank() }.toMutableList()
                  lista.add(0, linea)
                  val recortada = lista.take(15).joinToString("\n---\n")
                  prefs.edit().putString("log", recortada).apply()
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/tilin/app/MainActivity.kt <<'EOF'
          package com.tilin.app

          import android.animation.ValueAnimator
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
