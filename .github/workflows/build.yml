name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Crear archivos de la app
        run: |
          mkdir -p app/src/main/java/com/tilin/app
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Tilin"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tilin.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tilin.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Tilín"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PagoListenerService"
                      android:exported="true"
                      android:label="Tilín"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/tilin/app/PagoListenerService.kt <<'EOF'
          package com.tilin.app

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          class PagoListenerService : NotificationListenerService(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null

              private val palabras = listOf(
                  "te enviaron", "te envió", "te envio", "recibiste",
                  "te llegó", "te llego", "te pagaron", "te transfirieron",
                  "has recibido"
              )

              private val montoRegex =
                  Regex("""\$\s?(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{1,2})?|\d+)""")

              override fun onCreate() {
                  super.onCreate()
                  tts = TextToSpeech(this, this)
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("es", "CO")
                  }
              }

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName) return

                  val extras = sbn.notification.extras
                  val titulo = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val texto = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString()
                      ?: extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val completo = "$titulo $texto"

                  if (!completo.contains("$")) return

                  guardarLog(sbn.packageName + ": " + completo)

                  val minuscula = completo.lowercase()
                  if (palabras.none { minuscula.contains(it) }) return

                  val match = montoRegex.find(completo) ?: return
                  var n = match.groupValues[1]
                  val c = n.lastIndexOf(',')
                  if (c >= 0 && n.length - c - 1 <= 2) n = n.substring(0, c)
                  n = n.replace(".", "").replace(",", "")
                  if (n.isEmpty()) return

                  tts?.speak("Te llegaron $n pesos", TextToSpeech.QUEUE_ADD, null, "pago")
              }

              private fun guardarLog(linea: String) {
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val actuales = prefs.getString("log", "") ?: ""
                  val lista = actuales.split("\n---\n").filter { it.isNotBlank() }.toMutableList()
                  lista.add(0, linea)
                  val recortada = lista.take(15).joinToString("\n---\n")
                  prefs.edit().putString("log", recortada).apply()
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/tilin/app/MainActivity.kt <<'EOF'
          package com.tilin.app

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.util.Locale

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private var tts: TextToSpeech? = null
              private lateinit var estado: TextView
              private lateinit var logView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this, this)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val raiz = LinearLayout(this)
                  raiz.orientation = LinearLayout.VERTICAL
                  raiz.setPadding(pad, pad, pad, pad)

                  val titulo = TextView(this)
                  titulo.text = "Tilín 🔔"
                  titulo.textSize = 28f
                  raiz.addView(titulo)

                  estado = TextView(this)
                  estado.textSize = 16f
                  estado.setPadding(0, pad, 0, pad)
                  raiz.addView(estado)

                  val bPermiso = Button(this)
                  bPermiso.text = "1. Dar permiso de notificaciones"
                  bPermiso.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }
                  raiz.addView(bPermiso)

                  val bPrueba = Button(this)
                  bPrueba.text = "2. Probar la voz"
                  bPrueba.setOnClickListener {
                      tts?.speak("Te llegaron 15000 pesos", TextToSpeech.QUEUE_FLUSH, null, "test")
                  }
                  raiz.addView(bPrueba)

                  val bRefrescar = Button(this)
                  bRefrescar.text = "Actualizar historial"
                  bRefrescar.setOnClickListener { actualizar() }
                  raiz.addView(bRefrescar)

                  val subtitulo = TextView(this)
                  subtitulo.text = "Últimas notificaciones con dinero:"
                  subtitulo.setPadding(0, pad, 0, pad / 2)
                  raiz.addView(subtitulo)

                  logView = TextView(this)
                  logView.setTextIsSelectable(true)
                  val scroll = ScrollView(this)
                  scroll.addView(logView)
                  raiz.addView(scroll)

                  setContentView(raiz)
              }

              override fun onResume() {
                  super.onResume()
                  actualizar()
              }

              private fun actualizar() {
                  val activos = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  estado.text = if (activos.contains(packageName)) {
                      "✅ Tilín está activo y escuchando"
                  } else {
                      "⚠️ Falta el permiso. Toca el botón 1 y activa Tilín"
                  }
                  val prefs = getSharedPreferences("tilin", MODE_PRIVATE)
                  val log = prefs.getString("log", "") ?: ""
                  logView.text = if (log.isBlank()) "Todavía no hay notificaciones." else log
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts?.language = Locale("es", "CO")
                  }
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Tilin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
