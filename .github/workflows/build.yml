name: Build APK
on:
  push:
    paths:
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_NAME: "2.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Crear archivos de la app
        run: |
          VC=$((100 + ${{ github.run_number }}))
          mkdir -p app/src/main/java/com/tilin/app
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          cat > .gitignore <<'EOF'
          build/
          .gradle/
          local.properties
          *.apk
          EOF
          cat > NOTAS.md <<'EOF'
          # Rovika - notas del proyecto

          ## Que es
          App Android que lee las notificaciones de pago (Nequi, Bancolombia, Daviplata, Davivienda, Nu, BBVA y otros), las dice en voz alta y lleva la cuenta del dia. Todo se guarda solo en el telefono: la app no tiene permiso de internet.

          ## Donde esta todo
          - Este repositorio de GitHub guarda el codigo. El archivo .github/workflows/build.yml crea todos los archivos de la app y GitHub arma el APK.
          - La carpeta app/src/main/java/com/tilin/app tiene el codigo: MainActivity (pantallas y tutorial), PagoListenerService (lee notificaciones), Aviso (letrero), Voz y Apps.
          - rovika.keystore es la firma fija. NO la borres: gracias a ella cada version nueva se instala encima de la anterior sin perder datos.
          - La pestana Releases tiene cada version lista para descargar. Link fijo de la ultima: https://github.com/sflorez0989/tilin-app/releases/latest/download/Rovika.apk

          ## Como sacar una version nueva
          1. Editar .github/workflows/build.yml (o pedirle a Claude el codigo completo y pegarlo).
          2. Subir VERSION_NAME arriba en el archivo.
          3. Confirmar cambios y esperar el check verde en Actions.
          4. Descargar Rovika.apk desde Releases e instalar encima.

          ## Reglas para no danar la app
          - Un cambio a la vez y probar antes del siguiente.
          - Si una compilacion sale en rojo, la app instalada sigue funcionando. Mandar captura del error.
          - Para volver atras: en GitHub abrir el historial (History) de build.yml y copiar una version anterior.
          - No cambiar versiones de herramientas (Gradle 8.7, AGP 8.5.2, Kotlin 1.9.24, Java 17, ubuntu-24.04) sin necesidad.

          ## Como lee los pagos (textos reales vistos)
          - Nequi por QR o Bre-B: Te enviaron plata por Bre-B Te enviaron $17.000. Entra a tu app y revisa tu saldo.
          - Nequi entre cuentas: Envio NOMBRE te envio 7000, lo mejor! (sin signo de pesos).
          - Recarga desde Bancolombia: texto de la notificacion aun sin ver, se detecta por la palabra recarga.
          - Lo que el usuario envia, compras, GMF e impuestos se ignoran.

          ## Como seguir con Claude en un chat nuevo
          Claude no recuerda chats anteriores. Pegar este archivo y el contenido de build.yml, y contarle que se quiere cambiar. Pedirle siempre el codigo completo para pegar.

          ## Preferencias del dueno
          Conductor en Colombia, usa tablet Samsung sin computador e instala por APK. Prefiere pasos simples, codigo completo para pegar y mensajes cortos en espanol.

          ## Ideas pendientes
          - Gastos con tarjeta (falta ver una notificacion real de compra)
          - Resumen del mes y comparacion de semanas
          - Modo manejo con letras grandes
          - Sonido de caja registradora
          - Bloqueo con huella o PIN
          - Exportar a Excel
          - Probar Bancolombia, Nu y Davivienda con notificaciones reales
          - iPhone: Apple no permite leer notificaciones de otras apps, solo seria por correo
          - Antes de vender: pasar el repositorio a privado y publicar en Google Play
          EOF
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Rovika"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > app/build.gradle <<EOF
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tilin.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tilin.app"
                  minSdk 26
                  targetSdk 34
                  versionCode $VC
                  versionName "$VERSION_NAME"
              }
              signingConfigs {
                  rovika {
                      storeFile file('../rovika.keystore')
                      storePassword 'rovika123'
                      keyAlias 'rovika'
                      keyPassword 'rovika123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.rovika
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
